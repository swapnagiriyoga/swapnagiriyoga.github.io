<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#F6EEFF" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#120031" media="(prefers-color-scheme: dark)" />

    <!--
      SEO note: the title leads with what people actually search for ("online
      yoga classes"), not the tagline. `data-seo` marks every tag that
      src/lib/seo.js rewrites when the language changes — leave those attributes
      in place. The values here are the English defaults, so the file is still
      correct if the bundle never runs.
    -->
    <title data-seo="title">
      Online Yoga Classes with Swapnagiri Yoga | Live 1-on-1 on Google Meet
    </title>
    <meta
      name="description"
      data-seo="description"
      content="Live online yoga classes with Swapnagiri Yoga — personal one-to-one sessions on Google Meet, arranged around your week and open to every level. Taught in English, Hindi and Marathi."
    />
    <link rel="canonical" href="https://www.swapnagiriyoga.com/" data-seo="canonical" />

    <!--
      The apex domain 301s to www, so every absolute URL here must be the www
      form — pointing canonical at a redirecting hostname wastes the signal.
    -->
    <link rel="alternate" hreflang="en" href="https://www.swapnagiriyoga.com/" />
    <link rel="alternate" hreflang="hi" href="https://www.swapnagiriyoga.com/hi/" />
    <link rel="alternate" hreflang="mr" href="https://www.swapnagiriyoga.com/mr/" />
    <link rel="alternate" hreflang="x-default" href="https://www.swapnagiriyoga.com/" />

    <!-- Open Graph / social preview -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Swapnagiri Yoga" />
    <meta property="og:url" content="https://www.swapnagiriyoga.com/" data-seo="og:url" />
    <meta property="og:locale" content="en_US" data-seo="og:locale" />
    <meta
      property="og:title"
      data-seo="og:title"
      content="Online Yoga Classes with Swapnagiri Yoga | Live 1-on-1 on Google Meet"
    />
    <meta
      property="og:description"
      data-seo="og:description"
      content="Live online yoga classes with Swapnagiri Yoga — personal one-to-one sessions on Google Meet, arranged around your week and open to every level."
    />
    <meta property="og:image" content="https://www.swapnagiriyoga.com/og-image.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="Swapnagiri Yoga — live online yoga classes, find your inner peak"
    />
    <meta name="twitter:card" content="summary_large_image" />
    <meta
      name="twitter:title"
      data-seo="twitter:title"
      content="Online Yoga Classes with Swapnagiri Yoga | Live 1-on-1 on Google Meet"
    />
    <meta
      name="twitter:description"
      data-seo="twitter:description"
      content="Live online yoga classes with Swapnagiri Yoga — personal one-to-one sessions on Google Meet, arranged around your week and open to every level."
    />
    <meta name="twitter:image" content="https://www.swapnagiriyoga.com/og-image.jpg" />

    <!--
      Headings: Cormorant Garamond (elegant serif). Body: Inter (clean sans).
      Full system fallbacks are declared in index.css so the site still reads
      well if the network is unavailable.
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!--
      Cormorant and Inter carry no Devanagari glyphs, so Hindi and Marathi would
      fall back to whatever the OS happens to have. The Noto Devanagari pair is
      loaded alongside them and index.css switches to it on [lang="hi"|"mr"].
    -->
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400&family=Inter:wght@300;400;500;600&family=Noto+Serif+Devanagari:wght@400;500;600&family=Noto+Sans+Devanagari:wght@300;400;500;600&display=swap"
      rel="stylesheet"
    />

    <!-- Inline SVG favicon: a soft lavender summit. -->
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23F6EEFF'/%3E%3Cpath d='M4 24 L12 11 L17 18 L21 13 L28 24 Z' fill='%237B2CBF'/%3E%3Ccircle cx='23' cy='8' r='3' fill='%23C77DFF'/%3E%3C/svg%3E"
    />
    <!--
      Applies the saved theme and motion preference before first paint, so the
      page never flashes the wrong colours. Kept inline and dependency-free on
      purpose — it must run before the bundle loads.
    -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('swapnagiri-theme'); // 'light' | 'dark' | 'system'
          var mode = stored || 'system';
          var dark =
            mode === 'dark' ||
            (mode === 'system' &&
              window.matchMedia('(prefers-color-scheme: dark)').matches);
          document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');

          if (localStorage.getItem('swapnagiri-motion') === 'reduce') {
            document.documentElement.classList.add('force-reduce-motion');
          }

          /* The URL wins over the stored choice, so /hi/ opens in Hindi even
             for someone who once picked English on this device. Kept in step
             with the same rule in src/i18n/index.js. */
          var fromPath = location.pathname.split('/').filter(Boolean)[0];
          var lang =
            fromPath === 'hi' || fromPath === 'mr'
              ? fromPath
              : localStorage.getItem('swapnagiri-lang');
          if (lang === 'hi' || lang === 'mr') {
            document.documentElement.setAttribute('lang', lang);
          }
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'light');
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
