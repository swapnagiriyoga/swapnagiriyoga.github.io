<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#F6EEFF" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#120031" media="(prefers-color-scheme: dark)" />

    <title>Swapnagiri Yoga — Find Your Inner Peak</title>
    <meta
      name="description"
      content="Live online yoga with Swapnagiri Yoga. Personal sessions on Google Meet, arranged around your week and open to every level. Find stillness, build strength, reach your peak."
    />

    <!-- Open Graph / social preview -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Swapnagiri Yoga — Find Your Inner Peak" />
    <meta
      property="og:description"
      content="Live online yoga sessions you join from home, at times that suit your week. Breathe, move, and climb inward."
    />
    <meta name="twitter:card" content="summary_large_image" />

    <!--
      Headings: Cormorant Garamond (elegant serif). Body: Inter (clean sans).
      Full system fallbacks are declared in index.css so the site still reads
      well if the network is unavailable.
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400&family=Inter:wght@300;400;500;600&display=swap"
      rel="stylesheet"
    />

    <!-- Inline SVG favicon: a soft lavender summit. -->
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23F6EEFF'/%3E%3Cpath d='M4 24 L12 11 L17 18 L21 13 L28 24 Z' fill='%237B2CBF'/%3E%3Ccircle cx='23' cy='8' r='3' fill='%23C77DFF'/%3E%3C/svg%3E"
    />
    <!--
      Applies the saved theme and motion preference before first paint, so the
      page never flashes the wrong colours. Kept inline and dependency-free on
      purpose — it must run before the bundle loads.
    -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('swapnagiri-theme'); // 'light' | 'dark' | 'system'
          var mode = stored || 'system';
          var dark =
            mode === 'dark' ||
            (mode === 'system' &&
              window.matchMedia('(prefers-color-scheme: dark)').matches);
          document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');

          if (localStorage.getItem('swapnagiri-motion') === 'reduce') {
            document.documentElement.classList.add('force-reduce-motion');
          }
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'light');
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
